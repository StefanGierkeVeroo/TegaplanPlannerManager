<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeGA-Plan Ressourcenplanung</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --line:#e3e6ea; --line-strong:#cfd4da;
  --text:#1c2430; --muted:#6b7684; --accent:#1a56db; --accent-soft:#eaf0fe;
  --danger:#b42318; --danger-soft:#fef3f2; --ok:#067647; --ok-soft:#ecfdf3;
  --warn:#b54708; --warn-soft:#fffaeb;
  --radius:8px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
}
*{box-sizing:border-box}
/* Muss vor allen display-Regeln stehen: #boot und #app setzen display:flex und
   wuerden das hidden-Attribut sonst ueberstimmen. */
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select{font:inherit}

/* ---------------------------------------------------------------- Layout */
#app{display:flex;min-height:100vh}
aside{width:248px;flex:0 0 248px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
/* Das Logo ist reinweiss auf transparentem Grund und braucht daher eine
   dunkle Flaeche - sonst ist es unsichtbar. */
.brand{padding:18px;border-bottom:1px solid var(--line);background:#1c2430}
.brand img{max-width:150px;height:auto;display:block}
.logoplate{display:inline-block;background:#1c2430;border-radius:8px;padding:16px 22px}
.logoplate img{max-width:170px;height:auto;display:block}
nav{padding:12px 10px;flex:1}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:2px;
  border-radius:var(--radius);color:var(--text);text-decoration:none;font-weight:500}
nav a:hover{background:#f1f3f6}
nav a.active{background:var(--accent-soft);color:var(--accent)}
nav a svg{width:17px;height:17px;flex:0 0 17px;opacity:.75}
.userbox{padding:12px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.userbox .nm{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userbox button{margin-top:6px;background:none;border:none;color:var(--accent);padding:0;font-size:12.5px}

main{flex:1;min-width:0;padding:26px 30px 60px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{font-size:21px;margin:0 0 3px;font-weight:600;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px}

/* ---------------------------------------------------------------- Panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.filters{display:flex;gap:10px 14px;align-items:flex-end;flex-wrap:wrap;
  padding:12px 14px;border-bottom:1px solid var(--line);background:#fbfcfd}
.filters .f{display:flex;flex-direction:column;gap:4px}
.filters .f label{font-size:11.5px;color:var(--muted);font-weight:500}
.filters select,.filters input[type=date]{padding:6px 9px;border:1px solid var(--line-strong);
  border-radius:6px;background:#fff;font:inherit;font-size:13px;min-width:132px;color:inherit}
.filters select:focus,.filters input[type=date]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.filters .fspacer{flex:1;min-width:0}
.filters .fhint{flex-basis:100%;font-size:12px;color:var(--muted);line-height:1.5}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line-strong);border-radius:6px;background:#fff}
.search input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;opacity:.45}
.count{color:var(--muted);font-size:12.5px;margin-left:auto}

/* ---------------------------------------------------------------- Buttons */
.btn{border:1px solid var(--line-strong);background:#fff;color:var(--text);
  padding:8px 14px;border-radius:6px;font-weight:500}
.btn:hover:not(:disabled){background:#f7f8fa}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:#1546b8}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}

/* ---------------------------------------------------------------- Tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th{background:#fbfcfd;font-weight:600;font-size:12.5px;color:var(--muted);
  position:sticky;top:0;z-index:1;user-select:none}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--text)}
th .arrow{opacity:.5;font-size:10px;margin-left:3px}
td.subject{max-width:420px;white-space:normal}
tbody tr.clickable{cursor:pointer}
tbody tr:hover{background:#f8fafc}
tbody tr.sel{background:var(--accent-soft)}
tbody tr.sel:hover{background:#dfe8fd}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.check,th.check{width:38px;padding-right:0}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0;vertical-align:middle}
.empty{padding:40px;text-align:center;color:var(--muted)}
tbody tr.gesperrt td{color:#7a838f}
tbody tr.gesperrt:hover{background:transparent}
.chip{display:inline-block;font-size:11px;font-weight:600;line-height:1.5;padding:0 7px;
  border-radius:10px;background:var(--warn-soft);color:var(--warn);border:1px solid #fedf89;
  vertical-align:1px;white-space:nowrap}
.chip-mild{background:#f1f3f6;color:var(--muted);border-color:var(--line-strong)}
.hinweis{padding:9px 14px;border-bottom:1px solid var(--line);background:#fbfcfd;
  color:var(--muted);font-size:12.5px}

/* -------------------------------------------------------------- Paginator */
.pager{display:flex;align-items:center;gap:8px;padding:10px 14px;color:var(--muted);font-size:12.5px}
.pager .btn{padding:5px 10px}
.pager .spacer{margin-left:auto}

/* ------------------------------------------------------------------- Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{background:none;border:none;padding:10px 16px;color:var(--muted);
  font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ------------------------------------------------------------------ Forms */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:20px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input{width:100%;padding:8px 11px;border:1px solid var(--line-strong);border-radius:6px;background:#fff}
.field input[readonly]{background:#f7f8fa;color:#414c59}
.field input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}

/* ----------------------------------------------------------------- Dialog */
dialog{border:none;border-radius:10px;padding:0;box-shadow:0 20px 40px rgba(16,24,40,.18);
  max-width:min(560px,94vw);width:100%;color:var(--text)}
dialog::backdrop{background:rgba(16,24,40,.45)}
.dlg-head{padding:20px 22px 0}
.dlg-head h2{margin:0 0 4px;font-size:17px;font-weight:600}
.dlg-head p{margin:0;color:var(--muted);font-size:13px}
.dlg-body{padding:18px 22px}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px;border-top:1px solid var(--line);margin-top:6px}
.dlg-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dlg-grid .span2{grid-column:1 / -1}
.field select{width:100%;padding:8px 11px;border:1px solid var(--line-strong);border-radius:6px;background:#fff;font:inherit;color:inherit}
.field select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}

/* ---------------------------------------------------------------- Notices */
.notice{border-radius:6px;padding:11px 14px;font-size:13px;margin:0 0 14px;border:1px solid}
.notice.info{background:var(--accent-soft);border-color:#c7d7fd;color:#14399c}
.notice.warn{background:var(--warn-soft);border-color:#fedf89;color:var(--warn)}
.notice.err{background:var(--danger-soft);border-color:#fecdca;color:var(--danger)}
.notice.ok{background:var(--ok-soft);border-color:#abefc6;color:var(--ok)}
.notice ul{margin:7px 0 0;padding-left:18px}
.notice code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:3px;font-size:12px}

/* ---------------------------------------------------------------- Overlay */
#overlay{position:fixed;inset:0;background:rgba(245,246,248,.82);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:99}
#overlay.on{display:flex}
.spinner{width:26px;height:26px;border:3px solid var(--line-strong);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#overlay .txt{color:var(--muted);font-size:13px}

.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:520px;width:100%;padding:30px;text-align:center}
.card .logoplate{margin:0 0 22px}
.mono{font-family:Consolas,"Courier New",monospace;font-size:12px;word-break:break-all}
</style>
</head>

<script>
"use strict";

/* ======================================================================
   KONFIGURATION
   ====================================================================== */
const CONFIG = {
  tenantId:       "0d0e0c50-756e-48a8-af8d-5059f012dc5e",
  clientId:       "78b0dff6-f840-4204-a415-d816fa4e4841",
  environmentUrl: "https://tega-plandefault.crm4.dynamics.com",
  apiVersion:     "v9.2",

  // Uhrzeit-Konvention beim Schreiben der reinen Datumsfelder (UTC).
  // Entspricht dem Muster, das in allen vorhandenen Aufgaben steht.
  startTimeUtc: "09:00:00",
  endTimeUtc:   "17:00:00",

  pageSize:      100,   // Zeilen je Tabellenseite
  maxOpsPerSet:  200,   // Dataverse-Limit: 200 Operationen je OperationSet
  writeParallel: 6,     // gleichzeitige PssUpdate-Aufrufe je Block
  pollTimeoutMs: 90000  // Wartezeit auf die Scheduling-Engine
};

const SCOPES = [CONFIG.environmentUrl + "/user_impersonation"];
const REDIRECT_URI = location.origin + location.pathname;

const FV = "@OData.Community.Display.V1.FormattedValue";
const OS_STATUS = {
  192350000: "Offen", 192350001: "Ausstehend", 192350002: "Aufgegeben",
  192350003: "Abgeschlossen", 192350004: "Fehlgeschlagen"
};
const OS_TERMINAL = [192350002, 192350003, 192350004];

/* ======================================================================
   HILFSFUNKTIONEN
   ====================================================================== */
const $  = (s, r) => (r || document).querySelector(s);
const el = (t, a, h) => { const n = document.createElement(t);
  if (a) for (const k in a) n.setAttribute(k, a[k]);
  if (h !== undefined) n.innerHTML = h; return n; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function fmtDate(row, col) {
  if (row[col + FV]) return row[col + FV];
  if (!row[col]) return "";
  return new Date(row[col]).toLocaleDateString("de-DE");
}
function fmtProgress(v) {
  if (v === null || v === undefined || v === "") return "";
  return (v * 100).toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " %";
}

/* Priorität als Adjektiv statt als Zahl. Die Stufen sind fachlich vorgegeben:
   1 = Dringend, 2–4 = Wichtig, 5–7 = Mittel, 8–10 = Niedrig.
   Ein Wert außerhalb 1–10 wird als Zahl ausgegeben, damit er auffällt, statt
   still in eine Stufe zu rutschen. Geprüft am 18.08.2026: im Bestand kommen
   weder leere Werte noch Werte außerhalb 1–10 vor. */
/* Die vier Stufen für den Bearbeitungsdialog. Geschrieben wird jeweils der
   KLEINSTE Wert des Bereichs (so entschieden) – die Anzeige in der Tabelle
   leitet sich umgekehrt aus dem Bereich ab, siehe fmtPrioritaet. Beide
   Richtungen hängen an dieser einen Tabelle. */
const PRIO_STUFEN = [
  { wert: 1, text: "Dringend" },
  { wert: 2, text: "Wichtig" },
  { wert: 5, text: "Mittel" },
  { wert: 8, text: "Niedrig" }
];

/* Beschriftung einer im Dialog gewählten Stufe. */
function prioText(wert) {
  const st = PRIO_STUFEN.find(x => x.wert === Number(wert));
  return st ? st.text : String(wert);
}

function fmtPrioritaet(v) {
  if (v === null || v === undefined || v === "") return "";
  const n = Number(v);
  if (!Number.isFinite(n)) return String(v);
  if (n === 1) return "Dringend";
  if (n >= 2 && n <= 4) return "Wichtig";
  if (n >= 5 && n <= 7) return "Mittel";
  if (n >= 8 && n <= 10) return "Niedrig";
  return String(v);
}
// Datumsanteil eines Dataverse-Werts (die Felder liegen als 09:00Z/17:00Z vor)
const isoDay = v => (v ? String(v).slice(0, 10) : "");
// "2026-09-10" -> "10.09.2026"
const de = d => d
  ? new Date(d + "T00:00:00").toLocaleDateString("de-DE",
      { day: "2-digit", month: "2-digit", year: "numeric" })
  : "";

async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); }
  }));
  return out;
}

function overlay(on, text) {
  $("#overlay").classList.toggle("on", !!on);
  if (text) $("#overlayTxt").textContent = text;
}

/* ======================================================================
   AUTHENTIFIZIERUNG
   ====================================================================== */
let pca = null;

async function initAuth() {
  pca = new msal.PublicClientApplication({
    auth: {
      clientId: CONFIG.clientId,
      authority: "https://login.microsoftonline.com/" + CONFIG.tenantId,
      redirectUri: REDIRECT_URI,
      navigateToLoginRequestUrl: false
    },
    cache: { cacheLocation: "sessionStorage" }
  });
  await pca.initialize();

  const res = await pca.handleRedirectPromise();
  if (res && res.account) pca.setActiveAccount(res.account);

  let acct = pca.getActiveAccount() || pca.getAllAccounts()[0];
  if (!acct) { await pca.loginRedirect({ scopes: SCOPES }); return false; }
  pca.setActiveAccount(acct);

  $("#userName").textContent = acct.name || acct.username;
  $("#userMail").textContent = acct.username || "";
  return true;
}

async function getToken() {
  const r = await pca.acquireTokenSilent({ scopes: SCOPES, account: pca.getActiveAccount() })
    .catch(async e => {
      if (e instanceof msal.InteractionRequiredAuthError) {
        await pca.acquireTokenRedirect({ scopes: SCOPES });
        return null;
      }
      throw e;
    });
  if (!r) throw new Error("Anmeldung erforderlich");
  return r.accessToken;
}

/* ======================================================================
   DATAVERSE-ZUGRIFF
   ====================================================================== */
async function dv(path, opt) {
  opt = opt || {};
  const token = await getToken();
  const url = /^https?:/.test(path)
    ? path
    : CONFIG.environmentUrl + "/api/data/" + CONFIG.apiVersion + "/" + path.replace(/^\//, "");

  const headers = Object.assign({
    Authorization: "Bearer " + token,
    Accept: "application/json",
    "OData-MaxVersion": "4.0",
    "OData-Version": "4.0"
  }, opt.headers || {});
  if (opt.body !== undefined) headers["Content-Type"] = "application/json; charset=utf-8";

  const res = await fetch(url, {
    method: opt.method || "GET",
    headers,
    body: opt.body !== undefined ? JSON.stringify(opt.body) : undefined
  });

  if (!res.ok) {
    let msg = "HTTP " + res.status;
    try {
      const j = JSON.parse(await res.text());
      if (j && j.error && j.error.message) msg = j.error.message.split(/\r?\n/)[0];
    } catch (_) {}
    const err = new Error(msg); err.status = res.status; throw err;
  }
  if (res.status === 204) return null;
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

// Folgt @odata.nextLink, bis wirklich alles geladen ist.
async function dvAll(path, onProgress) {
  const rows = [];
  let next = path;
  while (next) {
    const r = await dv(next, {
      headers: { Prefer: 'odata.include-annotations="*",odata.maxpagesize=5000' }
    });
    rows.push.apply(rows, r.value);
    if (onProgress) onProgress(rows.length);
    next = r["@odata.nextLink"] || null;
  }
  return rows;
}

/* ======================================================================
   DATENHALTUNG
   ====================================================================== */
const PROJECT_SELECT = "msdyn_projectid,msdyn_subject,msdyn_scheduledstart,msdyn_finish,msdyn_progress";
const TASK_SELECT = "msdyn_projecttaskid,msdyn_subject,_msdyn_projectbucket_value," +
                    "msdyn_scheduledstart,msdyn_scheduledend,msdyn_priority,msdyn_progress," +
                    "_msdyn_project_value,msdyn_ismanual,msdyn_summary," +
                    // Nur fuer den Zeitraumfilter. ACHTUNG: msdyn_start/msdyn_finish sind
                    // bei manuell geplanten Aufgaben LEER (gepruefte 999 von 5.263 am
                    // 18.08.2026) - siehe Hinweis in der Filterleiste.
                    "msdyn_start,msdyn_finish";

// Bei manuell geplanten Aufgaben sind msdyn_scheduledstart/-end von der
// Scheduling-Engine schreibgeschuetzt (E_NOTEDITABLE). Nachgewiesen am 12.08.2026.
const istBearbeitbar = t => t.msdyn_ismanual !== true;

const store = { projects: [], tasks: [], byProject: new Map(), projectLabel: new Map() };

async function loadData() {
  overlay(true, "Projekte werden geladen …");
  store.projects = await dvAll("msdyn_projects?$select=" + PROJECT_SELECT + "&$orderby=msdyn_subject asc");

  overlay(true, "Aufgaben werden geladen …");
  store.tasks = await dvAll(
    "msdyn_projecttasks?$select=" + TASK_SELECT + "&$orderby=msdyn_subject asc",
    n => overlay(true, n.toLocaleString("de-DE") + " Aufgaben geladen …")
  );

  // Bei gleichnamigen Projekten das Startdatum zur Unterscheidung anhängen.
  const nameCount = new Map();
  for (const p of store.projects)
    nameCount.set(p.msdyn_subject, (nameCount.get(p.msdyn_subject) || 0) + 1);

  store.projectLabel.clear();
  for (const p of store.projects) {
    const dup = nameCount.get(p.msdyn_subject) > 1;
    const d = fmtDate(p, "msdyn_scheduledstart");
    store.projectLabel.set(p.msdyn_projectid,
      p.msdyn_subject + (dup && d ? " (ab " + d + ")" : ""));
  }

  store.byProject.clear();
  for (const t of store.tasks) {
    const pid = t._msdyn_project_value;
    t.__projectLabel = store.projectLabel.get(pid) || (t["_msdyn_project_value" + FV] || "");
    if (!store.byProject.has(pid)) store.byProject.set(pid, []);
    store.byProject.get(pid).push(t);
  }
  overlay(false);
}

/* ======================================================================
   TABELLE (Sortierung, Suche, Seitenwechsel, Auswahl)
   ====================================================================== */
function createTable(opt) {
  // opt: { columns, rows, getId, selectable, onRowClick, searchFields, emptyText,
  //        onSelectionChange, filters, filterHint }
  // filters: [{ key, label, type:'select'|'date', optionen(rows), test(row, wert) }]
  const state = { q: "", sort: opt.defaultSort || null, dir: opt.defaultDir || "asc", page: 0, f: {} };
  const selected = new Set();
  const root = el("div", { class: "panel" });

  /*
    Wendet die gesetzten Filter an. Mit 'ausser' laesst sich einer auslassen -
    so kann seine eigene Auswahlliste aus den Zeilen gebildet werden, welche die
    UEBRIGEN Filter passieren. Dadurch zeigt z. B. die Bucket-Liste nur noch die
    Buckets des gewaehlten Projekts.
  */
  function mitFiltern(rows, ausser) {
    for (const f of (opt.filters || [])) {
      if (f.key === ausser) continue;
      const w = state.f[f.key];
      if (w) rows = rows.filter(r => f.test(r, w));
    }
    return rows;
  }

  function filtered() {
    let rows = mitFiltern(opt.rows);
    const q = state.q.trim().toLowerCase();
    if (q) rows = rows.filter(r => opt.searchFields.some(f => {
      const v = typeof f === "function" ? f(r) : r[f];
      return String(v ?? "").toLowerCase().includes(q);
    }));
    if (state.sort) {
      const col = opt.columns.find(c => c.key === state.sort);
      if (col) {
        const mul = state.dir === "asc" ? 1 : -1;
        rows = rows.slice().sort((a, b) => {
          const av = col.sortValue(a), bv = col.sortValue(b);
          if (av === bv) return 0;
          if (av === null || av === undefined || av === "") return 1;   // Leerwerte ans Ende
          if (bv === null || bv === undefined || bv === "") return -1;
          return (av > bv ? 1 : -1) * mul;
        });
      }
    }
    return rows;
  }

  function render() {
    const rows = filtered();
    const pages = Math.max(1, Math.ceil(rows.length / CONFIG.pageSize));
    if (state.page >= pages) state.page = pages - 1;
    const slice = rows.slice(state.page * CONFIG.pageSize, (state.page + 1) * CONFIG.pageSize);

    const selectableRows = opt.selectable
      ? rows.filter(r => !opt.canSelect || opt.canSelect(r)) : [];
    const gesperrt = opt.selectable ? rows.length - selectableRows.length : 0;
    const allFilteredSelected = selectableRows.length > 0 &&
      selectableRows.every(r => selected.has(opt.getId(r)));

    let html = "";

    if (opt.filters && opt.filters.length) {
      html += '<div class="filters">';
      for (const f of opt.filters) {
        const wert = state.f[f.key] || "";
        html += '<div class="f"><label for="flt_' + f.key + '">' + esc(f.label) + '</label>';
        if (f.type === "date") {
          html += '<input type="date" id="flt_' + f.key + '" data-filter="' + f.key +
                  '" value="' + esc(wert) + '">';
        } else {
          const werte = f.optionen(mitFiltern(opt.rows, f.key));
          // Der gewaehlte Wert bleibt immer waehlbar, auch wenn ihn ein anderer
          // Filter gerade aus der Liste draengt - sonst spraenge die Auswahl um.
          if (wert && !werte.some(o => o.w === wert)) werte.unshift({ w: wert, t: wert });
          html += '<select id="flt_' + f.key + '" data-filter="' + f.key + '">' +
                  '<option value="">(alle)</option>' +
                  werte.map(o => '<option value="' + esc(o.w) + '"' +
                            (o.w === wert ? ' selected' : '') + '>' + esc(o.t) + '</option>').join('') +
                  '</select>';
        }
        html += '</div>';
      }
      const aktiv = Object.values(state.f).filter(Boolean).length;
      html += '<div class="fspacer"></div>';
      if (aktiv)
        html += '<button class="btn ghost" data-role="fclear">Filter zur\u00fccksetzen (' + aktiv + ')</button>';
      // Hinweistext darf HTML enthalten - er stammt aus dem Aufrufer, nicht aus Daten.
      const hinweis = opt.filterHint ? opt.filterHint(state.f, opt.rows) : "";
      if (hinweis) html += '<div class="fhint">' + hinweis + '</div>';
      html += '</div>';
    }

    html += '<div class="toolbar">';
    html += '<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
            '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
            '<input type="search" placeholder="' + esc(opt.searchPlaceholder || "Suchen …") +
            '" value="' + esc(state.q) + '" data-role="q"></div>';
    if (opt.selectable) {
      html += '<button class="btn primary" data-role="edit"' + (selected.size ? "" : " disabled") +
              '>Bearbeiten</button>';
      if (selected.size)
        html += '<button class="btn ghost" data-role="clear">Auswahl aufheben</button>';
    }
    html += '<span class="count">' +
      (opt.selectable && selected.size
        ? "<strong>" + selected.size.toLocaleString("de-DE") + "</strong> ausgewählt · "
        : "") +
      rows.length.toLocaleString("de-DE") + " von " + opt.rows.length.toLocaleString("de-DE") +
      " Datensätzen</span></div>";

    if (gesperrt > 0) {
      html += '<div class="hinweis">' + gesperrt.toLocaleString("de-DE") +
        " der angezeigten Aufgaben sind <strong>manuell geplant</strong> und daher nicht auswählbar – " +
        "ihre Termine sind über die Schnittstelle schreibgeschützt und lassen sich nur in " +
        "Project for the Web ändern.</div>";
    }

    html += '<div class="tablewrap"><table><thead><tr>';
    if (opt.selectable)
      html += '<th class="check"><input type="checkbox" data-role="all" title="Alle Treffer auswählen"' +
              (allFilteredSelected ? " checked" : "") + "></th>";
    for (const c of opt.columns) {
      const active = state.sort === c.key;
      html += '<th class="sortable ' + (c.cls || "") + '" data-sort="' + c.key + '">' + esc(c.label) +
        (active ? '<span class="arrow">' + (state.dir === "asc" ? "▲" : "▼") + "</span>" : "") + "</th>";
    }
    html += "</tr></thead><tbody>";

    if (!slice.length) {
      html += '<tr><td colspan="' + (opt.columns.length + (opt.selectable ? 1 : 0)) +
              '"><div class="empty">' + esc(opt.emptyText || "Keine Datensätze gefunden.") + "</div></td></tr>";
    } else {
      for (const r of slice) {
        const id = opt.getId(r);
        const isSel = selected.has(id);
        const waehlbar = !opt.canSelect || opt.canSelect(r);
        html += '<tr data-id="' + esc(id) + '" class="' + (isSel ? "sel " : "") +
                (waehlbar ? "" : "gesperrt ") + (opt.onRowClick ? "clickable" : "") + '">';
        if (opt.selectable)
          html += '<td class="check"><input type="checkbox" data-role="row"' +
                  (isSel ? " checked" : "") + (waehlbar ? "" : ' disabled title="Manuell geplant – Termine sind schreibgeschützt"') +
                  "></td>";
        for (const c of opt.columns) html += '<td class="' + (c.cls || "") + '">' + c.render(r) + "</td>";
        html += "</tr>";
      }
    }
    html += "</tbody></table></div>";

    if (pages > 1) {
      html += '<div class="pager"><span>Seite ' + (state.page + 1) + " von " + pages + "</span>" +
        '<span class="spacer"></span>' +
        '<button class="btn" data-role="prev"' + (state.page === 0 ? " disabled" : "") + ">Zurück</button>" +
        '<button class="btn" data-role="next"' + (state.page >= pages - 1 ? " disabled" : "") + ">Weiter</button></div>";
    }

    root.innerHTML = html;
    const qi = $('[data-role=q]', root);
    if (qi) {
      qi.addEventListener("input", e => {
        state.q = e.target.value; state.page = 0; render();
        // render() ersetzt das Eingabefeld – Fokus und Cursor wiederherstellen
        const n = $('[data-role=q]', root);
        n.focus();
        try { n.setSelectionRange(n.value.length, n.value.length); } catch (_) {}
      });
    }
  }

  root.addEventListener("click", ev => {
    const th = ev.target.closest("th[data-sort]");
    if (th) {
      const k = th.dataset.sort;
      if (state.sort === k) state.dir = state.dir === "asc" ? "desc" : "asc";
      else { state.sort = k; state.dir = "asc"; }
      render(); return;
    }
    const role = ev.target.dataset ? ev.target.dataset.role : null;
    if (role === "prev") { state.page--; render(); return; }
    if (role === "next") { state.page++; render(); return; }
    if (role === "clear") { selected.clear(); notify(); render(); return; }
    if (role === "fclear") { state.f = {}; state.page = 0; render(); return; }
    if (role === "edit") { opt.onEdit(Array.from(selected)); return; }
    if (role === "all") {
      // Erfasst alle Treffer des Filters – aber nur die bearbeitbaren.
      const rows = filtered().filter(r => !opt.canSelect || opt.canSelect(r));
      const on = ev.target.checked;
      for (const r of rows) { const id = opt.getId(r); if (on) selected.add(id); else selected.delete(id); }
      notify(); render(); return;
    }
    if (role === "row") {
      ev.stopPropagation();
      const id = ev.target.closest("tr").dataset.id;
      if (ev.target.checked) selected.add(id); else selected.delete(id);
      notify(); render(); return;
    }
    const tr = ev.target.closest("tbody tr[data-id]");
    if (tr && opt.onRowClick) opt.onRowClick(tr.dataset.id);
  });

  // 'change' blubbert bei Formularelementen - deshalb genuegt ein Zuhoerer auf
  // der Wurzel, obwohl render() die Elemente jedes Mal neu erzeugt.
  root.addEventListener("change", ev => {
    const k = ev.target.dataset ? ev.target.dataset.filter : null;
    if (!k) return;
    state.f[k] = ev.target.value;
    state.page = 0;
    render();
  });

  function notify() { if (opt.onSelectionChange) opt.onSelectionChange(Array.from(selected)); }

  render();
  return { root, selected, refresh: render, clearSelection() { selected.clear(); render(); } };
}

let pendingTasks = [];      // die aktuell im Dialog bearbeiteten Aufgaben
let afterWriteRefresh = null;

function openBulkEdit(ids, onDone) {
  // Sicherheitsnetz: manuell geplante Aufgaben nie in einen OperationSet lassen.
  // Ein einziger abgewiesener Datensatz laesst den gesamten Set scheitern.
  pendingTasks = ids.map(id => store.tasks.find(t => t.msdyn_projecttaskid === id))
                    .filter(t => t && istBearbeitbar(t));
  afterWriteRefresh = onDone;
  if (!pendingTasks.length) return;

  const dlg = $("#editDlg");
  $("#edStart").value = "";
  $("#edEnd").value = "";
  $("#edPrio").value = "";
  $("#editMsg").innerHTML = "";
  const projCount = new Set(pendingTasks.map(t => t._msdyn_project_value)).size;
  $("#editCount").textContent =
    pendingTasks.length.toLocaleString("de-DE") + " Aufgabe" + (pendingTasks.length === 1 ? "" : "n") +
    " aus " + projCount + " Projekt" + (projCount === 1 ? "" : "en") + " ausgewählt.";
  validateEdit();
  dlg.showModal();
}

function validateEdit() {
  const s = $("#edStart").value, e = $("#edEnd").value, p = $("#edPrio").value;
  const msg = $("#editMsg");
  msg.innerHTML = "";

  // Nichts ausgefüllt – es gibt nichts zu speichern.
  if (!s && !e && !p) { $("#edSave").disabled = true; return; }

  if (s && e && e < s) {
    msg.innerHTML = '<div class="notice err" style="margin:14px 0 0">Das Enddatum liegt vor dem Startdatum.</div>';
    $("#edSave").disabled = true; return;
  }

  // Nur ein Feld gesetzt: zeilenweise gegen den vorhandenen Wert prüfen.
  const conflicts = [];
  for (const t of pendingTasks) {
    const ns = s || isoDay(t.msdyn_scheduledstart);
    const ne = e || isoDay(t.msdyn_scheduledend);
    if (ns && ne && ne < ns) conflicts.push(t);
  }
  if (conflicts.length) {
    const list = conflicts.slice(0, 5)
      .map(t => "<li>" + esc(t.msdyn_subject) + " (" + esc(fmtDate(t, "msdyn_scheduledstart")) +
                " – " + esc(fmtDate(t, "msdyn_scheduledend")) + ")</li>").join("");
    msg.innerHTML = '<div class="notice err" style="margin:14px 0 0">Bei <strong>' + conflicts.length +
      "</strong> ausgewählten Aufgaben ergäbe sich ein Enddatum vor dem Startdatum:<ul>" + list +
      (conflicts.length > 5 ? "<li>… und " + (conflicts.length - 5) + " weitere</li>" : "") +
      "</ul>Bitte beide Felder füllen oder die Auswahl anpassen.</div>";
    $("#edSave").disabled = true; return;
  }
  $("#edSave").disabled = false;
}

function downloadBackupCsv() {
  const head = ["Aufgaben-ID", "Projekt", "Aufgabe", "Startdatum (vorher)", "Enddatum (vorher)",
                "Priorität (vorher)", "Prioritätsstufe (vorher)"];
  const lines = [head.join(";")];
  for (const t of pendingTasks) {
    lines.push([
      t.msdyn_projecttaskid,
      '"' + String(t.__projectLabel || "").replace(/"/g, '""') + '"',
      '"' + String(t.msdyn_subject || "").replace(/"/g, '""') + '"',
      isoDay(t.msdyn_scheduledstart),
      isoDay(t.msdyn_scheduledend),
      (t.msdyn_priority === null || t.msdyn_priority === undefined ? "" : t.msdyn_priority),
      '"' + fmtPrioritaet(t.msdyn_priority) + '"'
    ].join(";"));
  }
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
  // BOM voranstellen, damit Excel die Umlaute korrekt liest
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = el("a");
  a.href = URL.createObjectURL(blob);
  a.download = "aufgaben-vorher-" + stamp + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/*
  Zerlegt die mehrfach verschachtelte Fehlermeldung der Schedule-API in einen
  lesbaren Satz. Der Rohtext enthaelt JSON in JSON und ist unzumutbar.
*/
function erklaereFehler(raw, chunk) {
  const alle = name => {
    const out = [], re = new RegExp('\\\\*"' + name + '\\\\*"\\s*:\\s*\\\\*"([^"\\\\]+)', "g");
    let m; while ((m = re.exec(raw))) out.push(m[1]);
    return out;
  };
  const keys = alle("errorKey");
  const key  = keys.find(k => k !== "E_BATCHFAILED") || keys[0] || null;
  const feld = alle("field")[0] || null;
  const id   = (alle("element")[0] || "").toLowerCase();

  const task = chunk.find(t => t.msdyn_projecttaskid.toLowerCase() === id);
  const name = task ? "„" + task.msdyn_subject + "“"
                    : (id ? "Datensatz " + id : "einer Aufgabe");
  const feldName = { scheduledStart: "Startdatum", scheduledEnd: "Enddatum",
                     start: "Startdatum", finish: "Enddatum" }[feld] || feld;

  if (key === "E_NOTEDITABLE") {
    return "Bei " + name + " ist das " + (feldName || "Feld") + " schreibgeschützt. " +
      "Weil ein Vorgang nur vollständig gespeichert wird, blieben auch die übrigen " +
      "Aufgaben dieses Blocks unverändert.";
  }
  const msg = alle("ErrorMessage").filter(m => m !== "One of the batch requests failed")[0];
  if (msg) return "Bei " + name + ": " + msg;
  return String(raw || "").replace(/\s+/g, " ").slice(0, 300);
}

async function pollOperationSet(id) {
  const deadline = Date.now() + CONFIG.pollTimeoutMs;
  while (Date.now() < deadline) {
    await sleep(2000);
    const r = await dv("msdyn_operationsets(" + id + ")?$select=msdyn_status,_msdyn_psserrorlog_value");
    if (OS_TERMINAL.includes(r.msdyn_status))
      return { code: r.msdyn_status, label: OS_STATUS[r.msdyn_status], errorLog: r._msdyn_psserrorlog_value };
  }
  return { code: null, label: "Zeitüberschreitung" };
}

async function writeBulk(startDate, endDate, prio) {
  const startIso = startDate ? startDate + "T" + CONFIG.startTimeUtc + "Z" : null;
  const endIso   = endDate   ? endDate   + "T" + CONFIG.endTimeUtc   + "Z" : null;

  // Nach Projekt gruppieren – ein OperationSet gehört zu genau einem Projekt.
  const groups = new Map();
  for (const t of pendingTasks) {
    const p = t._msdyn_project_value;
    if (!groups.has(p)) groups.set(p, []);
    groups.get(p).push(t);
  }

  const results = [];
  let doneOps = 0;
  const totalOps = pendingTasks.length;
  const stamp = new Date().toLocaleString("de-DE");

  for (const [projectId, list] of groups) {
    const label = store.projectLabel.get(projectId) || projectId;
    for (let i = 0; i < list.length; i += CONFIG.maxOpsPerSet) {
      const chunk = list.slice(i, i + CONFIG.maxOpsPerSet);
      let osId = null;
      try {
        overlay(true, "Übergabe an die Planung – " + label + " (" +
                doneOps.toLocaleString("de-DE") + " von " + totalOps.toLocaleString("de-DE") + ")");

        const os = await dv("msdyn_CreateOperationSetV1", { method: "POST", body: {
          ProjectId: projectId,
          Description: "Massenbearbeitung – " + stamp
        }});
        osId = os.OperationSetId;

        await mapLimit(chunk, CONFIG.writeParallel, async t => {
          const entity = {
            "@odata.type": "Microsoft.Dynamics.CRM.msdyn_projecttask",
            msdyn_projecttaskid: t.msdyn_projecttaskid
          };
          if (startIso) entity.msdyn_scheduledstart = startIso;
          if (endIso)   entity.msdyn_scheduledend   = endIso;
          // msdyn_priority ist über PssUpdateV1 schreibbar und darf in derselben
          // Operation stehen wie die Termine (geprüft am 18.08.2026).
          if (prio)     entity.msdyn_priority       = Number(prio);
          await dv("msdyn_PssUpdateV1", { method: "POST", body: { Entity: entity, OperationSetId: osId } });
        });

        await dv("msdyn_ExecuteOperationSetV1", { method: "POST", body: { OperationSetId: osId } });

        overlay(true, "Die Planung verarbeitet die Änderung – " + label + " …");
        const st = await pollOperationSet(osId);
        doneOps += chunk.length;
        results.push({ project: label, count: chunk.length, status: st });
      } catch (err) {
        if (osId) {
          try { await dv("msdyn_AbandonOperationSetV1", { method: "POST", body: { OperationSetId: osId } }); }
          catch (_) {}
        }
        results.push({ project: label, count: chunk.length,
                       error: erklaereFehler(err.message, chunk) });
      }
    }
  }
  return { results, startDate, endDate, prio: prio ? Number(prio) : null };
}

function reportResult(run, before) {
  const ok = run.results.filter(r => r.status && r.status.code === 192350003);
  const failed = run.results.filter(r => r.error || (r.status && r.status.code === 192350004));
  const pending = run.results.filter(r => r.status && r.status.code === null);

  // Abweichungen: Wunschdatum gegen tatsächlichen Wert nach dem Neuladen
  const deviations = [];
  for (const b of before) {
    const now = store.tasks.find(t => t.msdyn_projecttaskid === b.id);
    if (!now) continue;
    if (run.startDate && isoDay(now.msdyn_scheduledstart) !== run.startDate)
      deviations.push({ t: now, feld: "Start", soll: run.startDate, ist: isoDay(now.msdyn_scheduledstart) });
    if (run.endDate && isoDay(now.msdyn_scheduledend) !== run.endDate)
      deviations.push({ t: now, feld: "Ende", soll: run.endDate, ist: isoDay(now.msdyn_scheduledend) });
    // Die Priorität rechnet die Engine nicht nach – eine Abweichung hier ist
    // ein echter Fehlschlag, kein Verschieben auf Arbeitstage.
    if (run.prio && Number(now.msdyn_priority) !== run.prio)
      deviations.push({ t: now, feld: "Priorität", soll: prioText(run.prio),
                        ist: fmtPrioritaet(now.msdyn_priority) });
  }

  let html = "";
  const affected = new Set(deviations.map(d => d.t.msdyn_projecttaskid));

  if (ok.length && !failed.length && !pending.length) {
    const n = ok.reduce((a, c) => a + c.count, 0);
    // Erfolgsmeldung nur, wenn die Engine die Wunschtermine auch übernommen hat.
    html += affected.size
      ? '<div class="notice warn"><strong>' + n.toLocaleString("de-DE") +
        " Aufgaben wurden verarbeitet – bei " + affected.size.toLocaleString("de-DE") +
        " davon hat die Planung ein abweichendes Datum gesetzt.</strong></div>"
      : '<div class="notice ok"><strong>' + n.toLocaleString("de-DE") +
        " Aufgaben wurden aktualisiert.</strong></div>";
  }
  if (failed.length) {
    html += '<div class="notice err"><strong>Nicht gespeichert:</strong><ul>' +
      failed.map(r => "<li>" + esc(r.project) + " (" + r.count + " Aufgaben): " +
        esc(r.error || (r.status && r.status.label) || "Fehler") + "</li>").join("") +
      "</ul>Details unter <em>Einstellungen → Zeitplanintegration → Vorgangsgruppen</em> bzw. <em>PSS-Fehlerprotokolle</em>.</div>";
  }
  if (pending.length) {
    html += '<div class="notice warn">Bei ' + pending.reduce((a, c) => a + c.count, 0) +
      " Aufgaben läuft die Verarbeitung noch. Bitte in einigen Minuten aktualisieren.</div>";
  }
  if (deviations.length) {
    const list = deviations.slice(0, 8).map(d =>
      "<li>" + esc(d.t.msdyn_subject) + " – " + d.feld + ": angefordert " + esc(de(d.soll)) +
      ", gesetzt " + esc(de(d.ist) || "—") + "</li>").join("");
    html += '<div class="notice warn"><strong>Abweichungen im Einzelnen</strong>' +
      " – Ursache sind in der Regel Arbeitstage, Kalender oder Abhängigkeiten:<ul>" +
      list + (deviations.length > 8 ? "<li>… und " + (deviations.length - 8) + " weitere</li>" : "") + "</ul></div>";
  }
  return html;
}

/*
  Filter fuer das Menue 'Projektaufgaben'.

  Die Auswahllisten entstehen aus den geladenen Daten, nicht aus einer festen
  Liste - so tauchen neue Projekte und Buckets von selbst auf. Buckets werden
  ueber ihren NAMEN gefiltert: es gibt 453 Bucket-Datensaetze, aber nur 123
  verschiedene Namen, und 47 davon kommen in mehreren Projekten vor.
*/
function taskFilters() {
  const liste = (rows, f) => [...new Set(rows.map(f).filter(Boolean))]
    .sort((a, b) => String(a).localeCompare(String(b), "de"))
    .map(x => ({ w: x, t: x }));

  return [
    { key: "manuell", label: "manuell", type: "select",
      optionen: () => [{ w: "ja", t: "ja" }, { w: "nein", t: "nein" }],
      test: (r, w) => (w === "ja") === (r.msdyn_ismanual === true) },

    { key: "projekt", label: "Projekt", type: "select",
      optionen: rows => liste(rows, r => r.__projectLabel),
      test: (r, w) => (r.__projectLabel || "") === w },

    { key: "bucket", label: "Bucket", type: "select",
      optionen: rows => liste(rows, r => r["_msdyn_projectbucket_value" + FV]),
      test: (r, w) => (r["_msdyn_projectbucket_value" + FV] || "") === w },

    { key: "prio", label: "Priorit\u00e4t", type: "select",
      // Gefiltert wird nach der STUFE, nicht nach der Zahl - passend zur Anzeige
      // in der Spalte. Sortiert nach Dringlichkeit, nicht alphabetisch.
      optionen: rows => {
        const rang = t => { const st = PRIO_STUFEN.find(x => x.text === t); return st ? st.wert : 99; };
        return [...new Set(rows.map(r => fmtPrioritaet(r.msdyn_priority)).filter(Boolean))]
          .sort((a, b) => rang(a) - rang(b)).map(t => ({ w: t, t: t }));
      },
      test: (r, w) => fmtPrioritaet(r.msdyn_priority) === w },

    // Zeitraum: die Aufgabe muss VOLLSTAENDIG im Fenster liegen (so entschieden).
    // 'von' wirkt auf msdyn_start, 'bis' auf msdyn_finish.
    { key: "von", label: "Start ab", type: "date",
      test: (r, w) => { const d = isoDay(r.msdyn_start);  return !!d && d >= w; } },

    { key: "bis", label: "Ende bis", type: "date",
      test: (r, w) => { const d = isoDay(r.msdyn_finish); return !!d && d <= w; } }
  ];
}

/*
  Macht sichtbar, was der Zeitraumfilter still verschluckt: msdyn_start und
  msdyn_finish sind bei manuell geplanten Aufgaben leer, solche Zeilen fallen
  daher heraus, sobald ein Datum gesetzt ist.
*/
function taskFilterHint(f, rows) {
  if (!f.von && !f.bis) return "";
  const ohne = rows.filter(r => (f.von && !r.msdyn_start) || (f.bis && !r.msdyn_finish)).length;
  if (!ohne) return "";
  return "Der Zeitraum wirkt auf <strong>msdyn_start</strong> und <strong>msdyn_finish</strong>. " +
    "<strong>" + ohne.toLocaleString("de-DE") + "</strong> Aufgaben haben dort keinen Wert und sind " +
    "deshalb ausgeblendet \u2013 darunter alle manuell geplanten. Die Spalten " +
    "<em>Startdatum</em>/<em>Enddatum</em> zeigen dagegen msdyn_scheduledstart/-end.";
}

  const v = $("#view");

/* ======================================================================
   ROUTING
   ====================================================================== */
function route() {
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  document.querySelectorAll("nav a").forEach(a => a.classList.remove("active"));

  if (parts[0] === "aufgaben") {
    $('nav a[data-nav=aufgaben]').classList.add("active");
    viewTasks();
  } else if (parts[0] === "projekte" && parts[1]) {
    $('nav a[data-nav=projekte]').classList.add("active");
    viewProjectDetail(parts[1], parts[2]);
  } else {
    $('nav a[data-nav=projekte]').classList.add("active");
    viewProjects();
  }
  window.scrollTo(0, 0);
}

// Bestätigungsdialog anzeigen und auf die Entscheidung warten.
function askConfirm() {
  return new Promise(resolve => {
    const cd = $("#confirmDlg"), go = $("#cfGo");
    const finish = ok => { go.removeEventListener("click", onGo);
                           cd.removeEventListener("close", onClose);
                           if (cd.open) cd.close();
                           resolve(ok); };
    const onGo = () => finish(true);
    const onClose = () => finish(false);   // Abbrechen oder Escape
    go.addEventListener("click", onGo);
    cd.addEventListener("close", onClose);
    cd.showModal();
  });
}

$("#edSave").addEventListener("click", async () => {
  if ($("#edSave").disabled) return;
  const startDate = $("#edStart").value || null;
  const endDate   = $("#edEnd").value || null;
  const prio      = $("#edPrio").value || null;
  $("#editDlg").close();

  buildConfirm(startDate, endDate, prio);
  if (!(await askConfirm())) return;

  const before = pendingTasks.map(t => ({ id: t.msdyn_projecttaskid }));
  downloadBackupCsv();

  try {
    const run = await writeBulk(startDate, endDate, prio);
    overlay(true, "Daten werden neu geladen …");
    await loadData();
    lastResultHtml = reportResult(run, before);
  } catch (err) {
    lastResultHtml = '<div class="notice err"><strong>Fehler:</strong> ' + esc(err.message) + "</div>";
    overlay(false);
  }
  if (afterWriteRefresh) afterWriteRefresh(); else route();
});

(async function start() {
  try {
    if (!(await initAuth())) return;      // Weiterleitung zur Anmeldung läuft
  } catch (err) {
    fatal("Anmeldung fehlgeschlagen", err.message,
      '<p class="sub">Prüfen Sie, ob in der App-Registrierung <code>' + esc(CONFIG.clientId) +
      '</code> unter <em>Authentifizierung</em> eine Plattform <strong>Einzelseitige Anwendung (SPA)</strong> ' +
      'mit genau dieser Umleitungs-URI eingetragen ist:</p><p class="mono">' + esc(REDIRECT_URI) + "</p>");
    return;
  }
  try {
    document.getElementById("boot").hidden = true;
    document.getElementById("app").hidden = false;
    await loadData();
    window.addEventListener("hashchange", route);
    route();
  } catch (err) {
    overlay(false);
    document.getElementById("app").hidden = true;
    document.getElementById("boot").hidden = false;
    fatal("Daten konnten nicht geladen werden", err.message,
      '<p class="sub">Häufigste Ursache: Der angemeldete Benutzer besitzt keine Dataverse-Sicherheitsrolle mit Leserechten auf <code>msdyn_project</code> und <code>msdyn_projecttask</code>.</p>');
  }
})();
